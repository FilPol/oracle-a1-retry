name: a1-retry

# Each run keeps retrying for ~50 minutes and then dispatches the next run itself, so coverage is
# continuous even when GitHub skips scheduled slots (common for new workflows). The hourly cron is
# only a backup that restarts the chain if it ever breaks. On success the workflow disables itself.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How long this run keeps retrying'
        required: false
        default: '50'

concurrency:
  group: a1-retry
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # lets the last step disable this workflow after a successful launch

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - name: Install OCI CLI
        run: python3 -m pip install --quiet --disable-pip-version-check oci-cli==3.96.2

      - name: Write OCI config
        env:
          OCI_KEY: ${{ secrets.OCI_KEY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
        run: |
          umask 077
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_KEY" > ~/.oci/key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=eu-milan-1\nkey_file=~/.oci/key.pem\n' \
            "$OCI_USER" "$OCI_FINGERPRINT" "$OCI_TENANCY" > ~/.oci/config

      - name: Retry launch
        id: retry
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_AD: ${{ secrets.OCI_AD }}
          OCI_SUBNET: ${{ secrets.OCI_SUBNET }}
          OCI_BOOT_VOLUME: ${{ secrets.OCI_BOOT_VOLUME }}
          SSH_PUBKEY: ${{ secrets.SSH_PUBKEY }}
          RUN_MINUTES: ${{ inputs.minutes || '50' }}
        run: bash retry.sh

      - name: Disable this workflow after a successful launch
        if: steps.retry.outputs.launched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable a1-retry.yml --repo "$GITHUB_REPOSITORY"

      - name: Remove OCI credentials
        if: always()
        run: rm -rf ~/.oci

      # workflow_dispatch is one of the events GITHUB_TOKEN is allowed to trigger. The new run queues
      # behind this one (concurrency group) and starts as soon as this job ends.
      - name: Chain the next run
        if: ${{ !cancelled() && steps.retry.outcome == 'success' && steps.retry.outputs.launched != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run a1-retry.yml --repo "$GITHUB_REPOSITORY" --ref main
